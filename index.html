<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkalong</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1c1c1e;
    --muted: #5b5b60;
    --background: #ffffff;
    --accent: #0f7a5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f2f7;
      --muted: #a1a1a8;
      --background: #000000;
      --accent: #3fbf98;
    }
  }
  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--background);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; }
  p { margin: 0 0 14px; }
  .lead { color: var(--muted); font-size: 19px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  nav a {
    color: #ffffff;
    background: var(--accent);
    text-decoration: none;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
  }
  footer { margin-top: 40px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Talkalong</h1>
  <p class="lead">A teleprompter for iPhone. Each word lights up when it's time to
  say it, and the script scrolls by itself while the front camera records you.</p>
  <p>Your scripts and videos stay on your iPhone.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy-policy.html">Privacy Policy</a>
  </nav>
  <footer>Made by Nadiia Kindrachuk</footer>
</main>
</body>
</html>
